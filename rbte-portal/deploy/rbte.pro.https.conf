server {
    listen 80;
    listen [::]:80;
    server_name rbte.pro;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://rbte.pro$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rbte.pro;
    ssl_certificate /etc/letsencrypt/live/rbte.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rbte.pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 32k;
    client_body_timeout 15s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    location /static/ {
        alias /opt/rbte-portal/current/staticfiles/;
        autoindex off;
    }
    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host rbte.pro;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 45s;
    }
    location ~ /\. { deny all; }
}
