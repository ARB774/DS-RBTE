{% load static %}<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}RBTE — вход в портал{% endblock %}</title>
<link rel="stylesheet" href="{% static 'portal.css' %}"></head>
<body><header class="header"><a class="brand" href="{% url 'services' %}"><span class="brand-icon">R</span> RBTE<span class="brand-caption">Рабочее пространство</span></a>
{% if user.is_authenticated %}<nav><span class="user-email">{{ user.email }}</span><form action="{% url 'logout' %}" method="post">{% csrf_token %}<button class="text-button">Выйти</button></form></nav>{% endif %}</header>
<main>{% block content %}{% endblock %}</main>
<footer><span>RBTE · Портал участников</span><span>Единая точка доступа к сервисам</span></footer></body></html>
