<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="svg-title svg-description">
  <title id="svg-title">Вторая независимая Туча C1 — после блока B</title>
  <desc id="svg-description">В блоке B записано: Необходимость увеличения продаж. Активен незаполненный блок D. Блоки A, C и D′ пока не сформулированы.</desc>
  <metadata>Канонический шаблон: tucha-template.svg. Активный элемент: D.</metadata>
  <defs>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#183b66" flood-opacity="0.10"/></filter>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#366ca8"/></marker>
    <marker id="arrow-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#d92d20"/></marker>
    <style>
      .canvas{fill:#f7f9fc}.title{font:700 38px "Segoe UI",Arial,sans-serif;fill:#172b4d}.eyebrow{font:700 18px "Segoe UI",Arial,sans-serif;letter-spacing:.08em;fill:#366ca8}.check{font:650 18px "Segoe UI",Arial,sans-serif;fill:#175cd3}.node-card{fill:#fff;stroke:#366ca8;stroke-width:2.5;filter:url(#card-shadow)}.node-label{font:750 30px "Segoe UI",Arial,sans-serif;fill:#172b4d}.node-content{font:400 28px "Segoe UI",Arial,sans-serif;fill:#5e6c84}.edge{fill:none;stroke:#366ca8;stroke-width:2.5;stroke-linecap:round;marker-end:url(#arrow-blue)}.conflict{fill:none;stroke:#d92d20;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-start:url(#arrow-red);marker-end:url(#arrow-red)}.node.is-active .node-card{stroke:#175cd3;stroke-width:6}.node.is-active .node-label{fill:#175cd3}
    </style>
  </defs>
  <rect class="canvas" x="0" y="0" width="1200" height="720" rx="28"/>
  <text class="eyebrow" x="40" y="48">ВТОРАЯ НЕЗАВИСИМАЯ ТУЧА</text>
  <text class="title" x="40" y="96">Туча клиента C1 — после блока B</text>
  <text class="check" x="1160" y="48" text-anchor="end">ШАГ 2: ФОРМУЛИРУЕМ D</text>
  <g aria-label="Логические связи"><path class="edge" d="M 790 235 L 678 235"/><path class="edge" d="M 790 545 L 678 545"/><path class="edge" d="M 340 235 L 308 335"/><path class="edge" d="M 340 545 L 308 405"/></g>
  <path class="conflict" d="M 980 365 L 938 390 L 1002 390 L 960 415"/>
  <g class="node" data-slot="A"><rect class="node-card" x="40" y="275" width="260" height="190" rx="26"/><text class="node-label" x="68" y="317">A</text><text class="node-content" x="68" y="365"><tspan x="68" dy="0">Пока не</tspan><tspan x="68" dy="36">сформулировано</tspan></text></g>
  <g class="node" data-slot="B"><rect class="node-card" x="340" y="120" width="330" height="230" rx="30"/><text class="node-label" x="368" y="166">B</text><text class="node-content" x="368" y="216"><tspan x="368" dy="0">Необходимость</tspan><tspan x="368" dy="36">увеличения продаж</tspan></text></g>
  <g class="node" data-slot="C"><rect class="node-card" x="340" y="430" width="330" height="230" rx="30"/><text class="node-label" x="368" y="476">C</text><text class="node-content" x="368" y="526"><tspan x="368" dy="0">Пока не</tspan><tspan x="368" dy="36">сформулировано</tspan></text></g>
  <g class="node is-active" data-slot="D"><rect class="node-card" x="790" y="120" width="370" height="230" rx="30"/><text class="node-label" x="820" y="166">D — АКТИВНЫЙ БЛОК</text><text class="node-content" x="820" y="216"><tspan x="820" dy="0">Пока не</tspan><tspan x="820" dy="36">сформулировано</tspan></text></g>
  <g class="node" data-slot="D-prime"><rect class="node-card" x="790" y="430" width="370" height="230" rx="30"/><text class="node-label" x="820" y="476">D′</text><text class="node-content" x="820" y="526"><tspan x="820" dy="0">Пока не</tspan><tspan x="820" dy="36">сформулировано</tspan></text></g>
