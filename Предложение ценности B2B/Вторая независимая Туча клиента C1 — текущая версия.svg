  <title id="svg-title">Вторая независимая Туча клиента C1 — текущая версия</title>
  <desc id="svg-description">
    Начальная версия второй Тучи клиента C1. Блок B выделен заметной рамкой и
    подписью шага. Во всех пяти блоках написано: Пока не сформулировано.
  </desc>
  <metadata>
