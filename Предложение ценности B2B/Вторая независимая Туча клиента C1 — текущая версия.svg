      .node-content { font: 400 28px "Segoe UI", Arial, sans-serif; fill: #5e6c84; }
      .edge { fill: none; stroke: #366ca8; stroke-width: 2.5; stroke-linecap: round; marker-end: url(#arrow-blue); }
      .conflict { fill: none; stroke: #d92d20; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-start: url(#arrow-red); marker-end: url(#arrow-red); }
      .node.is-active .node-card { stroke: #175cd3; stroke-width: 6; }
