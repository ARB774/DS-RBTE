<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <marker id="arrow" markerWidth="22" markerHeight="22" refX="19" refY="11" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L22,11 L0,22 Z" fill="#334155"/>
    </marker>
    <marker id="greenArrow" markerWidth="22" markerHeight="22" refX="19" refY="11" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L22,11 L0,22 Z" fill="#15803d"/>
    </marker>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 52px; font-weight: 700; fill: #111827; }
      .body { font-family: Arial, sans-serif; font-size: 38px; font-weight: 700; fill: #111827; text-anchor: middle; }
      .small { font-family: Arial, sans-serif; font-size: 27px; font-weight: 700; fill: #334155; text-anchor: middle; }
      .line { fill: none; stroke: #334155; stroke-width: 8; marker-end: url(#arrow); }
      .green-line { fill: none; stroke: #15803d; stroke-width: 10; marker-end: url(#greenArrow); }
      .node { stroke-width: 6; rx: 24; ry: 24; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#ffffff"/>
  <text x="960" y="66" class="title" text-anchor="middle">Основная негативная ветвь: отказ C1 от СТС</text>

  <rect x="70" y="860" width="730" height="160" class="node" fill="#e0f2fe" stroke="#0369a1"/>
  <rect x="94" y="876" width="300" height="38" rx="19" fill="#bae6fd"/>
  <text x="244" y="904" class="small">СУЩЕСТВУЕТ СЕЙЧАС</text>
  <text x="435" y="950" class="body">
    <tspan x="435" dy="0">C1 уверен, что компании</tspan>
    <tspan x="435" dy="47">нужна разработка ПЦ</tspan>
  </text>

  <rect x="1120" y="860" width="730" height="160" class="node" fill="#f1f5f9" stroke="#64748b"/>
  <rect x="1144" y="876" width="382" height="38" rx="19" fill="#e2e8f0"/>
  <text x="1335" y="904" class="small">ПЕРВОНАЧАЛЬНАЯ ИНЪЕКЦИЯ</text>
  <text x="1485" y="950" class="body">
    <tspan x="1485" dy="0">Предложить сразу 3 дня</tspan>
    <tspan x="1485" dy="47">диагностики + 6 дней СТС</tspan>
  </text>

  <path d="M435 860 C435 825, 760 835, 900 815" class="line"/>
  <path d="M1485 860 C1485 825, 1160 835, 1020 815" class="line"/>
  <circle cx="960" cy="785" r="55" fill="#ffffff" stroke="#334155" stroke-width="7"/>
  <text x="960" y="800" class="body" font-size="34">И</text>
  <path d="M960 730 L960 660" class="line"/>

  <rect x="500" y="500" width="920" height="155" class="node" fill="#fef3c7" stroke="#d97706"/>
  <rect x="524" y="516" width="150" height="38" rx="19" fill="#fde68a"/>
  <text x="599" y="544" class="small">ПРОГНОЗ</text>
  <text x="960" y="586" class="body">
    <tspan x="960" dy="0">СТС кажется лишней:</tspan>
    <tspan x="960" dy="47">«вывод о необходимости ПЦ уже известен»</tspan>
  </text>

  <path d="M960 500 L960 425" class="line"/>
  <rect x="500" y="285" width="920" height="135" class="node" fill="#ffedd5" stroke="#ea580c"/>
  <rect x="524" y="301" width="150" height="38" rx="19" fill="#fed7aa"/>
  <text x="599" y="329" class="small">ПРОГНОЗ</text>
  <text x="960" y="370" class="body">
    <tspan x="960" dy="0">Время и деньги воспринимаются</tspan>
    <tspan x="960" dy="47">как потраченные на лишнюю работу</tspan>
  </text>

  <path d="M960 285 L960 215" class="line"/>
  <rect x="500" y="90" width="920" height="120" class="node" fill="#fee2e2" stroke="#b91c1c"/>
  <rect x="524" y="106" width="365" height="38" rx="19" fill="#fecaca"/>
  <text x="706" y="134" class="small">ПРОГНОЗИРУЕМОЕ НЖЯ</text>
  <text x="960" y="180" class="body">C1 отказывается от предложения СТС</text>

  <rect x="1455" y="320" width="410" height="490" rx="28" fill="#dcfce7" stroke="#7c3aed" stroke-width="10"/>
  <rect x="1480" y="340" width="360" height="72" rx="22" fill="#bbf7d0"/>
  <text x="1660" y="370" class="small">
    <tspan x="1660" dy="0">ЗАЩИТНАЯ ИНЪЕКЦИЯ</tspan>
    <tspan x="1660" dy="30">ПРОВЕРЯЕМ</tspan>
  </text>
  <text x="1660" y="455" class="body" style="font-size:25px">
    <tspan x="1660" dy="0">Сначала отдельно</tspan>
    <tspan x="1660" dy="36">продаётся 3-дневная</tspan>
    <tspan x="1660" dy="36">диагностика.</tspan>
    <tspan x="1660" dy="44">Результат:</tspan>
    <tspan x="1660" dy="36">логически обоснованная</tspan>
    <tspan x="1660" dy="36">основная причина.</tspan>
    <tspan x="1660" dy="44">СТС предлагается,</tspan>
    <tspan x="1660" dy="36">только если диагностика</tspan>
    <tspan x="1660" dy="36">обосновала её необходимость</tspan>
  </text>

  <path d="M1455 692 C1325 692, 1235 692, 1080 692" class="green-line"/>
  <circle cx="1024" cy="692" r="34" fill="#ffffff" stroke="#15803d" stroke-width="8"/>
  <path d="M1008 676 L1040 708 M1040 676 L1008 708" stroke="#15803d" stroke-width="9" stroke-linecap="round"/>
  <text x="1280" y="672" class="small" fill="#15803d">РАЗРЫВАЕТ ПЕРЕХОД</text>
</svg>
