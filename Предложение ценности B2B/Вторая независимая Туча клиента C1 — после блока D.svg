<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Вторая Туча клиента C1 — два кандидата в блоке D</title>
  <desc id="desc">НЖЯ — продолжающееся сокращение объёма продаж после обучения менеджеров по продажам. B — увеличение доходов от продаж. В D сохранены два кандидата: закуп обучения менеджеров по продажам и закуп помощи по разработке предложения ценности. Остальные блоки не сформулированы.</desc>
  <defs>
    <marker id="arrow" markerWidth="32" markerHeight="32" viewBox="0 0 14 14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="#34495e"/>
    </marker>
    <marker id="conflict-start" markerWidth="34" markerHeight="34" viewBox="0 0 14 14" refX="2" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 14 0 L 0 7 L 14 14 z" fill="#b42318"/>
    </marker>
    <marker id="conflict-end" markerWidth="34" markerHeight="34" viewBox="0 0 14 14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="#b42318"/>
    </marker>
    <style>
      .title { font: 700 40px "Arial Narrow", "Segoe UI", Arial, sans-serif; fill: #111827; }
      .label { font: 800 80px "Arial Narrow", "Segoe UI", Arial, sans-serif; fill: #111827; }
      .body { font: 600 60px "Arial Narrow", "Segoe UI", Arial, sans-serif; fill: #17212f; text-anchor: middle; }
      .dense { font-size: 48px; }
      .box { stroke: #34495e; stroke-width: 7; }
      .active { stroke: #1261a0; stroke-width: 12; }
      .arrow { fill: none; stroke: #34495e; stroke-width: 8; marker-end: url(#arrow); }
      .conflict { fill: none; stroke: #b42318; stroke-width: 10; marker-start: url(#conflict-start); marker-end: url(#conflict-end); }
    </style>
  </defs>

  <rect width="1600" height="1200" fill="#ffffff"/>
  <text class="title" x="800" y="40" text-anchor="middle">НЖЯ: Продолжающееся сокращение объёма продаж</text>
  <text class="title" x="800" y="82" text-anchor="middle">после обучения менеджеров по продажам</text>

  <path class="arrow" d="M 1070 325 L 1025 325"/>
  <path class="arrow" d="M 1070 945 L 1025 945"/>
  <path class="arrow" d="M 525 325 C 510 325, 508 430, 495 470"/>
  <path class="arrow" d="M 525 945 C 510 945, 508 770, 495 730"/>
  <path class="conflict" d="M 1320 555 L 1320 700"/>

  <rect class="box" x="15" y="380" width="480" height="440" rx="28" fill="#f5f7fa"/>
  <text class="label" x="48" y="470">A</text>
  <text class="body" x="255" y="575"><tspan x="255">Не</tspan><tspan x="255" dy="78">сформулировано</tspan></text>

  <rect class="box" x="525" y="95" width="500" height="460" rx="28" fill="#eaf4ff"/>
  <text class="label" x="560" y="190">B</text>
  <text class="body" x="775" y="290"><tspan x="775">Увеличение</tspan><tspan x="775" dy="78">доходов</tspan><tspan x="775" dy="78">от продаж</tspan></text>

  <rect class="box" x="525" y="715" width="500" height="460" rx="28" fill="#f5f7fa"/>
  <text class="label" x="560" y="810">C</text>
  <text class="body" x="775" y="905"><tspan x="775">Не</tspan><tspan x="775" dy="78">сформулировано</tspan></text>

  <rect class="active" x="1070" y="95" width="515" height="460" rx="28" fill="#eaf4ff"/>
  <text class="label" x="1105" y="190">D</text>
  <text class="body dense" x="1328" y="245">
    <tspan x="1328">1. Закуп обучения</tspan>
    <tspan x="1328" dy="55">менеджеров по продажам</tspan>
    <tspan x="1328" dy="70">2. Закуп помощи</tspan>
    <tspan x="1328" dy="55">по разработке</tspan>
    <tspan x="1328" dy="55">предложения ценности</tspan>
  </text>

  <rect class="box" x="1070" y="715" width="515" height="460" rx="28" fill="#f5f7fa"/>
  <text class="label" x="1105" y="810">D′</text>
  <text class="body" x="1328" y="905"><tspan x="1328">Не</tspan><tspan x="1328" dy="78">сформулировано</tspan></text>
</svg>
